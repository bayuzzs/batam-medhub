        reference_currency:
          $ref: "#/components/schemas/CurrencyCode"
        journey_id:
          oneOf:
            - $ref: "#/components/schemas/ResourceId"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/UtcInstant"
        updated_at:
          $ref: "#/components/schemas/UtcInstant"

    TripRequestDetail:
      type: object
