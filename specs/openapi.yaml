          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          minLength: 1
          maxLength: 100

    ProviderEventType:
      type: string
      enum:
        - FERRY_DELAYED
        - FERRY_CANCELLED
        - HOSPITAL_APPOINTMENT_CHANGED
        - HOSPITAL_ADDITIONAL_CARE_REQUESTED
        - HOSPITAL_CLINICAL_HOLD
        - HOTEL_ROOM_UNAVAILABLE
        - HOTEL_RESERVATION_PROBLEM
        - TRANSPORT_DELAYED
        - TRANSPORT_UNAVAILABLE

    ProviderEventTarget:
      type: object
      additionalProperties: false
      properties:
        itinerary_item_id:
          $ref: "#/components/schemas/ResourceId"
        external_reservation_id:
          type: string
          minLength: 1
          maxLength: 128
      anyOf:
        - required: [itinerary_item_id]
        - required: [external_reservation_id]

    ProviderEventDetails:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        delay_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        replacement_time_window:
          $ref: "#/components/schemas/TimeWindow"
        additional_service_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        additional_duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        priority:
          type: string
          enum: [ROUTINE, URGENT]
        travel_clearance_status:
          type: string
          enum: [CLEARED, NOT_CLEARED, PENDING_PROVIDER_REVIEW]
        operational_requirements:
          type: array
          maxItems: 20
          items:
            type: string
        instruction_reference:
          type: string
          minLength: 1
          maxLength: 500

    ProviderEventRequest:
      type: object
      additionalProperties: false
      description: |
        The backend applies event-specific validation after structural schema
        validation. Delays require `delay_minutes`; appointment changes require
        `replacement_time_window`; clinical holds require travel-clearance
        status; and hospital additional care requires the replacement window,
        service code, duration, priority, travel clearance, operational
        requirements, and instruction reference. Missing required event facts
        return `422` and never enter impact analysis.
      required: [external_event_id, journey_id, event_type, occurred_at, target, actor, details]
      properties:
        external_event_id:
          type: string
          minLength: 3
          maxLength: 128
          description: |
            Unique within the authenticated provider. Reuse is replay-safe only
            when the canonical request-body fingerprint is identical.
        journey_id:
          $ref: "#/components/schemas/ResourceId"
        event_type:
          $ref: "#/components/schemas/ProviderEventType"
        occurred_at:
          $ref: "#/components/schemas/UtcInstant"
        target:
          $ref: "#/components/schemas/ProviderEventTarget"
        actor:
          $ref: "#/components/schemas/ActorSnapshot"
        details:
          $ref: "#/components/schemas/ProviderEventDetails"
    ProviderEventReceipt:
      type: object
      additionalProperties: false
      required: [provider_event_id, outcome, disruption_id, received_at]
      properties:
        provider_event_id:
          $ref: "#/components/schemas/ResourceId"
        outcome:
          type: string
          enum: [NO_ACTION, DISRUPTION_CREATED, DUPLICATE]
          description: DUPLICATE means an identical provider event was replayed.
        disruption_id:
          oneOf:
            - $ref: "#/components/schemas/ResourceId"
            - type: "null"
        received_at:
          $ref: "#/components/schemas/UtcInstant"

    DisruptionStatus:
      type: string
      enum:
        - DETECTED
        - VALIDATING
        - ANALYZING
        - CLINICAL_HOLD
        - MANUAL_REVIEW
        - REPLAN_READY
        - AWAITING_APPROVAL
        - APPLYING
        - RESOLVED
        - RECOVERY_FAILED

    ImpactSummary:
      type: object
      additionalProperties: false
      required: [severity, affected_item_ids, explanation]
      properties:
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CLINICAL_HOLD]
        affected_item_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ResourceId"
        explanation:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string

    RecoveryChange:
      type: object
      additionalProperties: false
      required: [change_type, old_itinerary_item_id, replacement_item, explanation]
      properties:
        change_type:
          type: string
          enum: [ADDED, CHANGED, REMOVED, UNCHANGED]
        old_itinerary_item_id:
          oneOf:
            - $ref: "#/components/schemas/ResourceId"
            - type: "null"
        replacement_item:
          oneOf:
            - $ref: "#/components/schemas/PlanItem"
            - type: "null"
        explanation:
          type: string
          maxLength: 500

    RecoveryOption:
      type: object
      additionalProperties: false
      required: [id, disruption_id, rank, status, expires_at, changes, time_delta_minutes, price_delta]
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        disruption_id:
          $ref: "#/components/schemas/ResourceId"
        rank:
          type: integer
          minimum: 1
          maximum: 2
        status:
          type: string
          enum: [PROPOSED, APPROVED, APPLYING, APPLIED, EXPIRED, FAILED]
        expires_at:
          $ref: "#/components/schemas/UtcInstant"
        changes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecoveryChange"
        time_delta_minutes:
          type: integer
          description: Signed change in final journey completion time versus the analyzed itinerary.
        price_delta:
          $ref: "#/components/schemas/MoneyDelta"

    Disruption:
      type: object
      additionalProperties: false
      required:
        - id
        - journey_id
        - provider_event_id
        - analyzed_itinerary_version
        - status
        - impact
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        journey_id:
          $ref: "#/components/schemas/ResourceId"
        provider_event_id:
          $ref: "#/components/schemas/ResourceId"
        analyzed_itinerary_version:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/DisruptionStatus"
        impact:
          $ref: "#/components/schemas/ImpactSummary"
        created_at:
          $ref: "#/components/schemas/UtcInstant"
        updated_at:
          $ref: "#/components/schemas/UtcInstant"

    DisruptionDetail:
      type: object
      additionalProperties: false
      required: [disruption, recovery_options]
      properties:
        disruption:
          $ref: "#/components/schemas/Disruption"
        recovery_options:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/RecoveryOption"

    DemoResetRequest:
      type: object
      additionalProperties: false
      required: [scenario, confirm]
      properties:
        scenario:
          type: string
          const: DEFAULT
        confirm:
          type: boolean
          const: true

    DemoResetResponse:
      type: object
      additionalProperties: false
      required: [status, scenario, reset_at]
      properties:
        status:
          type: string
          const: RESET
        scenario:
          type: string
          const: DEFAULT
        reset_at:
          $ref: "#/components/schemas/UtcInstant"

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, request_id, details]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
          example: INVALID_STATE
        message:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
        request_id:
          $ref: "#/components/schemas/RequestId"
        details:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
