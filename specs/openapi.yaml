    ItineraryVersionSummary:
      type: object
      additionalProperties: false
      required: [id, version, status, based_on_disruption_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED, ABANDONED]
        based_on_disruption_id:
          oneOf:
            - $ref: "#/components/schemas/ResourceId"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/UtcInstant"

    JourneyDetail:
