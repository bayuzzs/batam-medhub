openapi: 3.1.0
info:
  title: Batam MedHub Core API
  version: 0.1.0
  summary: Patient journey orchestration and provider-authored disruption contract.
  description: |
    The Batam MedHub core API turns a supported planned-care request into a
    feasible, confirmable, and recoverable cross-provider journey.

    Cloudflare Workers AI is used only to extract structured intent. The core
    validates model output, catalog membership, provider availability, journey
    constraints, booking transitions, and disruption recovery deterministically.

    All data in the hackathon environment is synthetic. Prices use integer
    minor units. Instants use UTC while schedule objects retain IANA time zones.
servers:
  - url: http://{api_host}:{api_port}
    description: Local development
    variables:
      api_host:
        default: localhost
      api_port:
        default: "8080"
tags:
  - name: Health
    description: Process and datastore health.
  - name: Catalog
    description: Supported medical-service catalog.
  - name: Trip Requests
    description: Intent extraction, clarification, planning, and confirmation.
  - name: Journeys
    description: Confirmed journeys and immutable itinerary versions.
  - name: Disruptions
    description: Provider events, impact analysis, and recovery approval.
  - name: Demo
    description: Explicitly protected synthetic-data reset operations.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness.
      security: []
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                database_status: NOT_CHECKED
                checked_at: "2026-08-15T08:00:00Z"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check API and core datastore readiness.
      security: []
      responses:
        "200":
          description: The API and core datastore are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                database_status: UP
                checked_at: "2026-08-15T08:00:00Z"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/medical-services:
    get:
      tags: [Catalog]
      operationId: listMedicalServices
      summary: List active medical services that Batam MedHub can orchestrate.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Active provider-authored medical services.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalServiceListResponse"
              examples:
                default_catalog:
                  externalValue: ./examples/core/medical-services.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/trip-requests:
    post:
      tags: [Trip Requests]
      operationId: createTripRequest
      summary: Create a trip request and extract structured intent.
      description: |
        The backend calls Workers AI, validates the structured result, and then
        applies catalog and safety rules. The backend, not the model, decides
        the final intent resolution and workflow status.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
            example:
              prompt: I need a same-day basic medical check-up in Batam on 22 August, leaving from HarbourFront with my spouse, with a budget of SGD 400.
              locale: en
      responses:
        "201":
          description: Trip request created and intent resolution persisted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              description: Relative URL of the trip request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripRequestDetail"
              examples:
                matched:
                  externalValue: ./examples/core/matched-trip-request.json
                needs_clarification:
                  externalValue: ./examples/core/needs-clarification-trip-request.json
                unsupported_service:
                  externalValue: ./examples/core/unsupported-trip-request.json
                out_of_scope:
                  externalValue: ./examples/core/out-of-scope-trip-request.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/trip-requests/{trip_request_id}:
    get:
      tags: [Trip Requests]
      operationId: getTripRequest
      summary: Retrieve a trip request and its latest plan options.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/TripRequestId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Trip request owned by the authenticated patient.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/trip-requests/{trip_request_id}/intent:
    patch:
      tags: [Trip Requests]
      operationId: amendTripRequestIntent
      summary: Answer a clarification or correct extracted intent.
      description: At least one of `answer` or `corrections` must be supplied.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/TripRequestId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendIntentRequest"
      responses:
        "200":
          description: Intent amended, revalidated, and persisted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripRequestDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/trip-requests/{trip_request_id}/plans:
    post:
      tags: [Trip Requests]
      operationId: generateTripPlans
      summary: Generate at most two feasible cross-provider plans.
      description: |
        Planning is deterministic after intent validation. Provider searches
        may partially fail, but an option is returned only when every required
        hard constraint passes.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/TripRequestId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Planning completed, possibly with no feasible options.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningResult"
              examples:
                feasible:
                  externalValue: ./examples/core/plan-result.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/plan-options/{plan_option_id}/confirm:
    post:
      tags: [Trip Requests, Journeys]
      operationId: confirmPlanOption
      summary: Explicitly approve and confirm one plan option.
      description: |
        The core revalidates offers, creates provider holds, confirms them, and
        compensates newly created resources if any later operation fails.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/PlanOptionId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "201":
          description: All required reservations confirmed and journey created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              description: Relative URL of the active journey itinerary.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyDetail"
              examples:
                itinerary_v1:
                  externalValue: ./examples/core/active-journey-v1.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/journeys/{journey_id}/itinerary:
    get:
      tags: [Journeys]
      operationId: getJourneyItinerary
      summary: Retrieve the active itinerary and immutable version history.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/JourneyId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Journey and all itinerary versions owned by the patient.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/journeys/{journey_id}/itineraries/{version}:
    get:
      tags: [Journeys]
      operationId: getJourneyItineraryVersion
      summary: Retrieve one immutable itinerary version with all of its items.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/JourneyId"
        - $ref: "#/components/parameters/ItineraryVersionNumber"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Requested itinerary version belonging to the patient's journey.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/provider/disruptions:
    post:
      tags: [Disruptions]
      operationId: submitProviderDisruption
      summary: Submit and assess a provider-authored operational event.
      description: |
        `X-Provider-Key` authenticates the provider organization. The backend
        derives provider identity and type from that key. The actor object is a
        provider-asserted audit snapshot and is not independent user auth.

        The event type must be compatible with the authenticated provider type,
        and the targeted itinerary item or reservation must belong to that
        provider and journey. A mismatch returns `403`.

        `(provider_id, external_event_id)` is a deduplication key. An identical
        request-body fingerprint replays the existing outcome; reusing the key
        with different event facts returns `409`.
      security:
        - ProviderSecret: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderEventRequest"
            examples:
              hospital_additional_care:
                externalValue: ./examples/core/disruption-request.json
      responses:
        "202":
          description: Event persisted or deduplicated and assessment recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderEventReceipt"
              examples:
                disruption_created:
                  externalValue: ./examples/core/disruption-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/disruptions/{disruption_id}:
    get:
      tags: [Disruptions]
      operationId: getDisruption
      summary: Retrieve disruption impact and available recovery options.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/DisruptionId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Disruption belonging to the patient's journey.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisruptionDetail"
              examples:
                additional_care_recovery:
                  externalValue: ./examples/core/disruption-detail.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/recovery-options/{recovery_option_id}/approve:
    post:
      tags: [Disruptions, Journeys]
      operationId: approveRecoveryOption
      summary: Approve a logistical recovery and activate a successor itinerary.
      security:
        - PatientBearer: []
      parameters:
        - $ref: "#/components/parameters/RecoveryOptionId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Recovery applied and the new itinerary version activated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyDetail"
              examples:
                itinerary_v2:
                  externalValue: ./examples/core/recovery-approved-v2.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/demo/reset:
    post:
      tags: [Demo]
      operationId: resetDemoData
      summary: Reset synthetic core orchestration state to the default scenario.
      description: |
        This operation resets only the core datastore and must be disabled
        outside the hackathon demo environment. The repository-level demo
        reset procedure separately invokes the provider reset/reseed command;
        the core never connects to provider databases.
      security:
        - DemoSecret: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoResetRequest"
      responses:
        "200":
          description: Synthetic core state reset and reference seed data restored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    PatientBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Verified patient JWT. The `sub` claim owns trip requests and journeys.
        The `preferred_currency` claim is an ISO 4217 display currency.
    ProviderSecret:
      type: apiKey
      in: header
      name: X-Provider-Key
      description: Provider-specific secret used for manual event submission.
    DemoSecret:
      type: apiKey
      in: header
      name: X-Demo-Key
      description: Secret available only when explicit demo mode is enabled.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller correlation ID. The backend generates one when absent.
      schema:
        $ref: "#/components/schemas/RequestId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reusable only for an identical authenticated operation and request body.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      example: idem-trip-000001
    TripRequestId:
      name: trip_request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"
    PlanOptionId:
      name: plan_option_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"
    JourneyId:
      name: journey_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"
    ItineraryVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DisruptionId:
      name: disruption_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"
    RecoveryOptionId:
      name: recovery_option_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"

  headers:
    RequestId:
      description: Correlation ID for this response.
      schema:
        $ref: "#/components/schemas/RequestId"
    IdempotencyReplayed:
      description: True when a prior identical mutation result was replayed.
      schema:
        type: boolean
      example: false

  responses:
    BadRequest:
      description: The request is syntactically invalid or fails basic validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Required authentication is missing or invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The authenticated principal cannot perform this operation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Current state, availability, or idempotency conflicts with the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: The request is well-formed but violates domain rules.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: The backend failed unexpectedly.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required datastore, provider, or model dependency is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Suggested retry delay in seconds when known.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ResourceId:
      type: string
      minLength: 3
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$"
      example: trip-000001

    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      example: req-core-000001

    UtcInstant:
      type: string
      format: date-time
      description: RFC 3339 instant normalized to UTC and ending in `Z`.
      example: "2026-08-22T03:00:00Z"

    IanaTimezone:
      type: string
      minLength: 3
      maxLength: 64
      description: IANA time-zone identifier.
      example: Asia/Jakarta

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      example: SGD

    Money:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: Integer minor units using the ISO 4217 exponent for the currency.
          example: 12500
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    ConvertedMoney:
      type: object
      additionalProperties: false
      required: [source, display, fx_rate, fx_source, fx_effective_at, estimated]
      properties:
        source:
          $ref: "#/components/schemas/Money"
        display:
          $ref: "#/components/schemas/Money"
        fx_rate:
          type: string
          pattern: '^[0-9]+(?:\.[0-9]+)?$'
          description: Decimal string, never a binary floating-point value.
          example: "11850.000000"
        fx_source:
          type: string
          example: DEMO_STATIC_2026_08
        fx_effective_at:
          $ref: "#/components/schemas/UtcInstant"
        estimated:
          type: boolean
          const: true

    PriceSummary:
      type: object
      additionalProperties: false
      required: [source_totals, display_total, estimated]
      properties:
        source_totals:
          type: array
          minItems: 1
          description: One subtotal for each original provider currency.
          items:
            $ref: "#/components/schemas/Money"
        display_total:
          $ref: "#/components/schemas/Money"
        estimated:
          type: boolean
          const: true

    MoneyDelta:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, estimated]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Signed change in the patient's reference currency.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        estimated:
          type: boolean
          const: true

    DateWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    TimeWindow:
