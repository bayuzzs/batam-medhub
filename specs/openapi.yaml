    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [prompt, locale]
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 2000
        locale:
          type: string
          enum: [en, id]
          description: Input language hint. Product responses remain English in this slice.

    IntentResolution:
      type: string
      enum: [MATCHED, NEEDS_CLARIFICATION, UNSUPPORTED_SERVICE, OUT_OF_SCOPE]

    StayType:
      type: string
      enum: [SAME_DAY, OVERNIGHT, FLEXIBLE]

    IntentPreferences:
      type: object
      additionalProperties: false
      required: [language, hotel_tier, accessibility]
      properties:
        language:
          type: [string, "null"]
        hotel_tier:
          type: [string, "null"]
          enum: [null, STANDARD, PREMIUM]
        accessibility:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            maxLength: 64

    StructuredIntent:
      type: object
      additionalProperties: false
      description: |
        Structurally strict output from the language boundary. After schema
        validation, the backend applies resolution-specific invariants:
        `MATCHED` requires all planning fields and an empty `missing_fields`;
        `NEEDS_CLARIFICATION` requires missing fields and one question;
        `UNSUPPORTED_SERVICE` requires only `unsupported_reason`; and
        `OUT_OF_SCOPE` requires only a safe `out_of_scope_reason`. Nullable
        values must never be filled with facts not stated by the patient.
      required:
        - schema_version
        - resolution
        - intent_category
        - requested_service_text
        - service_code
        - candidate_service_codes
        - origin_port
        - date_window
        - patient_count
        - companion_count
        - stay_type
        - budget
        - preferences
        - missing_fields
        - clarification_question
        - out_of_scope_reason
        - unsupported_reason
      properties:
        schema_version:
          type: string
          const: "1.0"
        resolution:
          $ref: "#/components/schemas/IntentResolution"
        intent_category:
          type: [string, "null"]
          maxLength: 64
        requested_service_text:
          type: string
          maxLength: 300
        service_code:
          type: [string, "null"]
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        candidate_service_codes:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        origin_port:
          type: [string, "null"]
          maxLength: 64
        date_window:
          oneOf:
            - $ref: "#/components/schemas/DateWindow"
            - type: "null"
        patient_count:
          type: [integer, "null"]
          minimum: 1
          maximum: 10
        companion_count:
          type: [integer, "null"]
          minimum: 0
          maximum: 10
        stay_type:
          oneOf:
            - $ref: "#/components/schemas/StayType"
            - type: "null"
        budget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        preferences:
          $ref: "#/components/schemas/IntentPreferences"
        missing_fields:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        clarification_question:
          type: [string, "null"]
          maxLength: 500
        out_of_scope_reason:
          type: [string, "null"]
          maxLength: 500
        unsupported_reason:
          type: [string, "null"]
          maxLength: 500
    IntentCorrections:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        service_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        origin_port:
          type: string
          maxLength: 64
        date_window:
          $ref: "#/components/schemas/DateWindow"
        patient_count:
          type: integer
          minimum: 1
          maximum: 10
        companion_count:
          type: integer
          minimum: 0
          maximum: 10
        stay_type:
          $ref: "#/components/schemas/StayType"
        budget:
          $ref: "#/components/schemas/Money"
        preferences:
          $ref: "#/components/schemas/IntentPreferences"

    AmendIntentRequest:
      type: object
      additionalProperties: false
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 1000
        corrections:
          $ref: "#/components/schemas/IntentCorrections"
      anyOf:
        - required: [answer]
        - required: [corrections]

    TripRequestStatus:
      type: string
      enum:
        - DRAFT
        - PARSING_INTENT
        - NEEDS_INPUT
        - UNSUPPORTED_SERVICE
        - OUT_OF_SCOPE
        - PLANNING
        - NO_MATCH
        - PLAN_READY
        - CONFIRMING
        - ACTIVE
        - CONFIRMATION_FAILED
        - MANUAL_REVIEW

    TripRequest:
      type: object
      additionalProperties: false
      required:
