# ==============================================================================
# Batam MedHub — nginx reverse proxy for the backend API
#
# Domain:      api.bayumaulana.my.id  (point an A record at the VPS public IP)
# Upstream:    the backend API container, published only on host 127.0.0.1:8080
#
# Install (as root / with sudo):
#   sudo cp api.bayumaulana.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.bayumaulana.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the Let's Encrypt certificate (installs a renewed cert and the
# redirect below is regenerated automatically by certbot --nginx):
#   sudo certbot --nginx -d api.bayumaulana.my.id
# ==============================================================================

# --- HTTP -> HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.bayumaulana.my.id;

    # Let certbot use this for challenges if you prefer a webroot flow.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS reverse proxy ------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.bayumaulana.my.id;

    # Certificate paths written by certbot (Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/api.bayumaulana.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bayumaulana.my.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.bayumaulana.my.id/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # The mobile app sends chat prompts; allow a little headroom.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
